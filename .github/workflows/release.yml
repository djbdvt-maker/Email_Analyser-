name: HopZero Release & Checksum Publisher

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Package & Publish Signed Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js 20.x
      uses: actions/setup-node@v7
      with:
        node-version: '20.x'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock

    - name: Verify Golden Outputs Before Release
      run: |
        python scripts/check_golden.py

    - name: Package Signed Standalone Archive
      run: |
        python scripts/package_release.py

    - name: Create GitHub Release with Cryptographic Checksums
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/releases/hopzero-*-standalone.zip
          dist/releases/hopzero-*-standalone.zip.sha256
        draft: false
        prerelease: false
        generate_release_notes: true
