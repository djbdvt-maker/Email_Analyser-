name: HopZero Multi-OS CI Matrix

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  matrix-test:
    name: Test (${{ matrix.os }}, Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']
        node-version: ['20.x']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: '04_FRONTEND/package-lock.json'

    - name: Install Python Dependencies from Lockfile
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock

    - name: Bytecode & Lint Compile Check
      run: |
        python -m compileall -q 01_REGISTRY 02_FORENSICS 03_BACKEND hopzero scripts

    - name: Frontend Build (npm ci & tsc & vite)
      run: |
        cd 04_FRONTEND
        npm ci
        npm run build

    - name: Golden Regression Baseline Verification (Zero Drift Invariant)
      run: |
        python scripts/check_golden.py

    - name: Full Pytest Test Suite
      run: |
        python -m pytest -q

    - name: Offline Acceptance & Security Isolation Test
      run: |
        python scripts/offline_acceptance_test.py

    - name: Run System Diagnostics (doctor)
      run: |
        python scripts/doctor.py
