name: HopZero Nightly Golden Drift & Upstream Build

on:
  schedule:
    # Run every night at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  nightly-drift-check:
    name: Upstream Drift Verification
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install Python Dependencies from Lockfile
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock
        pip install -e .

    - name: Install Latest Upstream Frontend Dependencies
      run: |
        cd 04_FRONTEND
        npm install
        npm run build

    - name: Verify Golden Regression Corpus (Zero Drift Invariant)
      id: golden_check
      run: |
        python scripts/check_golden.py

    - name: Run Two-Phase Offline Acceptance Suite
      id: acceptance_check
      run: |
        python scripts/offline_acceptance_test.py

    - name: Run Network Isolation Test
      run: |
        python scripts/test_network_isolation.py

    - name: Alert / Report on Drift Failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `[ALERT] Nightly Golden Drift Detected - ${new Date().toISOString().split('T')[0]}`,
            body: `### Critical Architectural Alert\nNightly upstream drift build encountered a failure against the golden regression baseline or offline acceptance test.\n\nCommit: ${context.sha}\nWorkflow Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
          });
