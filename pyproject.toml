[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hopzero"
version = "4.2.0"
description = "Deterministic Email Forensics & BotChain Tool Suite"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [
    { name = "HopZero Engineering", email = "engineering@hopzero.local" }
]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "SQLAlchemy==2.0.35",
    "alembic==1.13.2",
    "psycopg2-binary==2.9.9",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt>=4.0.0",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    "pytest==9.1.1",
    "httpx==0.27.2",
    "laya>=0.3.20",
    "maxminddb>=2.6.0",
    "requests>=2.31.0",
    "platformdirs>=4.2.0",
    "playwright>=1.47.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "httpx>=0.27.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hopzero*"]

[tool.pytest.ini_options]
testpaths = [
    "02_FORENSICS/tests",
    "03_BACKEND/tests",
    "07_EXTENSION/tests"
]
python_files = "test_*.py"
addopts = "-q"
