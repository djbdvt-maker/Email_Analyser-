[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hopzero"
version = "4.2.0"
description = "Deterministic Email Forensics & BotChain Tool Suite"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "HopZero Engineering", email = "engineering@hopzero.local" }
]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "SQLAlchemy==2.0.35",
    "alembic==1.13.2",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "pyjwt[crypto]>=2.9.0",
    "bcrypt>=4.0.0",
    "cryptography>=42.0.0",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    "PyYAML>=6.0.0",
    "maxminddb>=2.6.0",
    "requests>=2.31.0",
    "platformdirs>=4.2.0",
    "yara-python>=3.11.0"
]

[project.optional-dependencies]
sandbox = [
    "playwright>=1.47.0"
]
yara = [
    "yara-python>=3.11.0"
]
laya = [
    "laya>=0.3.20"
]
postgres = [
    "psycopg2-binary==2.9.9"
]
dev = [
    "pytest>=8.3.3",
    "httpx>=0.27.2"
]
all = [
    "playwright>=1.47.0",
    "laya>=0.3.20",
    "psycopg2-binary==2.9.9",
    "pytest>=8.3.3",
    "httpx>=0.27.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hopzero*"]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "01_REGISTRY",
    "02_FORENSICS",
    "03_BACKEND"
]
testpaths = [
    "01_REGISTRY/tests",
    "02_FORENSICS/tests",
    "03_BACKEND/tests",
    "05_QA/regression",
    "07_EXTENSION/tests"
]
python_files = "test_*.py"
filterwarnings = [
    "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated:DeprecationWarning:jose.*",
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning:starlette.*"
]
addopts = "-v --tb=short"

